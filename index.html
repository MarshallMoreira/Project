<!DOCTYPE html>
<html lang="en">
<head>
  <title>Student Suggestor</title>
  <meta charset="UTF-8">
  <script src="script.js" defer></script> <!-- im not sure what im doing -->
  <link href="style.css" rel="stylesheet" />
</head>
<body>

  <h1>Student Suggestor</h1>
  <div id="inputArea"> <!-- I might want to make this change dynamically so this feels maybe necessary -->
    <form>
      <p>
        <label for="title">Title:</label>
        <input id="title" name="post_title" />
      </p>

      <p>
        <label for="msg">Message:</label>
        <textarea id="msg" name="post_msg"></textarea>
      </p>

      <p>
        <button type="submit">Submit your suggestion</button>
      </p>
    </form>
    <br>
    <h2>Suggestions</h2>
    <table>
      <tr>
        <th>Title</th>
        <th>Suggestion</th>
        <th>Votes</th>
      </tr>
      <tr>
        <td>Fix AC</td>
        <td>Example text aaaaaaaa</td>
        <td>+2</td>
      </tr>
      <tr>
        <td>Example</td>
        <td>Example</td>
        <td>-100</td>
      </tr>
    </table>

    <button id="test">test button</button>
  </div>
</body>
</html>
