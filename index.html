<!DOCTYPE html>
<html lang="en">
<head>
  <title>Student Suggestor</title>
  <meta charset="UTF-8">
  <script src="script.js" defer></script> <!-- im not sure what im doing -->
  <link href="style.css" rel="stylesheet" />
</head>
<body>

  <h1>Student Suggestor</h1>
  <h2>Create</h2>
  <div>
    <form>
      <p>
        <label for="title">Title:</label>
        <input id="title" name="post_title" />
      </p>

      <p>
        <label for="msg">Message:</label>
        <textarea id="msg" name="post_msg"></textarea>
      </p>

      <p>
        <button type="submit">Submit your suggestion</button>
      </p>
    </form>
    <br>
    <h2>Suggestions</h2>
    <h3>Search</h3>
    <label for="search">Search:</label>
    <input id="search" name="search" />
    <select>
      <option value="title">By Title</option>
      <option value="suggestion">By Contents</option>
      <option value="votes">By Votes</option>
      <option value="recent">By Most Recent</option>
    </select>
    <table> <!-- When I actually make this work, I can have a function that takes a post ID, gets the data and puts it in a table -->
      <tr>
        <th>Title</th>
        <th>Suggestion</th>
        <th>Votes</th>
        <th>Info</th>
      </tr>
      <tr>
        <td>Fix AC</td>
        <td>Example text aaaaaaaa</td>
        <td>+2</td>
        <td><p>Posted by: <em>John</em><br>Posted on: <em>5/10/26</em><span class="id-text">ID: 123456</span></p></td>
      </tr>
      <tr>
        <td>Example</td>
        <td>Example</td>
        <td>-100</td>
        <p>Posted by: <em>Someone</em><br>Posted on: <em>1/2/23</em><span class="id-text">ID: number</span></p>
      </tr>
    </table>

    <br>
    <button id="test">test button</button>
  </div>
</body>
</html>
